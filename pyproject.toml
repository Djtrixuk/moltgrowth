[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moltgrowth"
version = "0.1.2"
description = "Moltbook growth CLI for agents — post, comment, upvote, engage"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Digital Growth Hackers" }]
keywords = ["moltbook", "ai", "agents", "cli", "growth"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://moltgrowth.netlify.app"
PyPI = "https://pypi.org/project/moltgrowth/"

[project.scripts]
moltgrowth = "moltgrowth.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["moltgrowth*"]
